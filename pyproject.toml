[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopra"
version = "1.0.0"
authors = [
    {name = "Matthieu Wilhelm", email = "matthieu.wilhelm@agroscope.admin.ch"},
]
description = "Swiss Orchard Protection Recommendation Algorithm - SOPRA model for Grapholita funebrana population dynamics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["agriculture", "pest-management", "population-dynamics", "modeling", "entomology"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
visualization = [
    "networkx>=2.6.0",
]
all = [
    "pytest>=6.0",
    "pytest-cov", 
    "black",
    "flake8",
    "mypy",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "networkx>=2.6.0",
]

[project.urls]
"Homepage" = "https://github.com/agroscope-ch/sopra"
"Bug Reports" = "https://github.com/agroscope-ch/sopra/issues"
"Source" = "https://github.com/agroscope-ch/sopra"
"Documentation" = "https://sopra.readthedocs.io/"

[project.scripts]
sopra-verify = "sopra.cli:verify_package"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sopra = ["*.txt", "data/*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=sopra --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist"]